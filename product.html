<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Dragon Triko | تفاصيل الموديل</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #f8f9fa;
      --text-main: #111111;
      --text-muted: #666666;
      --primary-red: #d90429;
      --primary-black: #0f172a;
      --accent-gray: #f1f5f9;
      --border-color: #e2e8f0;
      --radius-lg: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding-bottom: 40px; }

    .container { width: min(1000px, 92%); margin: 0 auto; }

    header {
      background: #ffffff; border-bottom: 1px solid var(--border-color); padding: 14px 0; margin-bottom: 24px;
    }
    .nav { display: flex; align-items: center; justify-content: space-between; }
    .back-link { text-decoration: none; color: var(--text-main); font-weight: 800; font-size: 14px; display: flex; align-items: center; gap: 6px; }

    .product-page {
      display: grid; grid-template-columns: 1fr 1fr; gap: 30px; background: #ffffff;
      padding: 24px; border-radius: var(--radius-lg); border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0,0,0,0.04);
    }
    @media (max-width: 768px) { .product-page { grid-template-columns: 1fr; padding: 16px; } }

    .image-box { width: 100%; aspect-ratio: 3/4; border-radius: 14px; overflow: hidden; background: #f1f5f9; }
    .image-box img { width: 100%; height: 100%; object-fit: cover; }

    .details-box { display: flex; flex-direction: column; gap: 14px; justify-content: center; }
    .tag { display: inline-block; background: #ffe5e5; color: var(--primary-red); padding: 4px 12px; border-radius: 99px; font-weight: 800; font-size: 12px; width: fit-content; }
    .title { font-size: 24px; font-weight: 900; color: var(--primary-black); }
    .price { font-size: 22px; font-weight: 900; color: var(--primary-red); }

    .info-list { display: grid; gap: 10px; margin: 10px 0; }
    .info-item {
      display: flex; justify-content: space-between; padding: 12px 14px;
      background: var(--accent-gray); border-radius: 10px; font-weight: 700; font-size: 14px;
    }
    .info-item span { color: var(--text-muted); }

    .btn-wa-big {
      background: #25d366; color: #fff; text-decoration: none; text-align: center;
      padding: 16px; border-radius: 12px; font-weight: 900; font-size: 16px;
      display: block; transition: transform .2s; margin-top: 10px;
    }
    .btn-wa-big:hover { transform: translateY(-2px); }
  </style>
</head>

<body>

  <header>
    <div class="container nav">
      <a class="brand" href="index.html">
  <img src="Logo.png" alt="Dragon Triko" style="height: 42px; width: auto; border-radius: 6px;">
      </a>
      
      <strong style="font-family:'Montserrat',sans-serif; font-weight:900;">DRAGON TRIKO</strong>
    </div>
  </header>

  <main class="container">
    <div class="product-page" id="productContainer">
      <div style="text-align:center; padding:40px; grid-column: 1 / -1;">جاري تحميل تفاصيل الموديل...</div>
    </div>
  </main>

  <script>
    const WHATSAPP_NUMBER = '905343265940';

    function formatImageUrl(url) {
      if (!url) return '';
      url = String(url).trim();
      const matchId = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      if (matchId && matchId[1]) {
        return `https://lh3.googleusercontent.com/d/${matchId[1]}`;
      }
      return url;
    }

    async function loadProductDetails() {
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id');

      if (!productId) {
        document.getElementById('productContainer').innerHTML = '<div>عفواً، لم يتم تحديد الموديل.</div>';
        return;
      }

      try {
        const response = await fetch('products.json?v=' + new Date().getTime());
        const data = await response.json();
        
        const item = data.find(p => String(p.id) === String(productId));

        if (!item) {
          document.getElementById('productContainer').innerHTML = '<div>عفواً، الموديل غير موجود.</div>';
          return;
        }

        const rawImg = item.image || item['الصورة'] || '';
        const imgUrl = formatImageUrl(rawImg) || 'https://via.placeholder.com/400x530/f1f5f9/0f172a?text=Dragon+Triko';
        const title = item.title || item['اسم الموديل'] || 'موديل بدون اسم';
        const code = item.code || item['الكود'] || item.id;
        const price = item.price || item['السعر'] || 'غير محدد';
        const colors = item.colors || item['الألوان'] || item['الوان'] || 'متعددة';
        const fabric = item.fabric || item['الخامة'] || '-';
        const sizes = item.sizes || item['المقاسات'] || '-';
        const moq = item.moq || item['اقل كمية'] || item['أقل كمية'] || '-';
        const notes = item.notes || item['ملاحظات'] || '-';
        const tag = item.tag || item['التصنيف'] || 'تريكو';

        const waMsg = encodeURIComponent(`السلام عليكم، أود حجز/طلب موديل: ${title} (الكود: ${code}) بسعر: ${price}`);

        document.title = `${title} | Dragon Triko`;

        document.getElementById('productContainer').innerHTML = `
          <div class="image-box">
            <img src="${imgUrl}" alt="${title}">
          </div>
          <div class="details-box">
            <span class="tag">${tag}</span>
            <h1 class="title">${title}</h1>
            <div class="price">السعر: ${price}</div>

            <div class="info-list">
              <div class="info-item"><span>كود الموديل:</span> <strong>${code}</strong></div>
              <div class="info-item"><span>الألوان المتوفرة:</span> <strong>${colors}</strong></div>
              <div class="info-item"><span>الخامة:</span> <strong>${fabric}</strong></div>
              <div class="info-item"><span>المقاسات المتاحة:</span> <strong>${sizes}</strong></div>
              <div class="info-item"><span>أقل كمية للطلب (MOQ):</span> <strong>${moq}</strong></div>
              <div class="info-item"><span>ملاحظات:</span> <strong>${notes}</strong></div>
            </div>

            <a href="https://wa.me/${WHATSAPP_NUMBER}?text=${waMsg}" target="_blank" class="btn-wa-big">
              طلب هذا الموديل مباشرة عبر الواتساب
            </a>
          </div>
        `;

      } catch (err) {
        document.getElementById('productContainer').innerHTML = '<div>حدث خطأ أثناء تحميل البيانات.</div>';
      }
    }

    loadProductDetails();
  </script>
</body>
</html>
