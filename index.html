<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Dragon Triko | كتالوج التريكو الشتوي</title>

  <!-- الخطوط -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #f8f9fa;
      --bg-card: #ffffff;
      --text-main: #111111;
      --text-muted: #666666;
      --primary-red: #d90429;
      --primary-black: #0f172a;
      --accent-gray: #f1f5f9;
      --border-color: #e2e8f0;
      --radius: 12px;
      --radius-lg: 20px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
      --shadow-md: 0 10px 25px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding-bottom: 40px; }

    .container { width: min(1200px, 94%); margin: 0 auto; }

    /* الهيدر */
    .top-bar {
      background: var(--primary-black); color: #fff; text-align: center;
      padding: 7px 10px; font-size: 11.5px; font-weight: 700;
    }

    header {
      position: sticky; top: 0; z-index: 40; background: #ffffff;
      border-bottom: 1px solid var(--border-color); box-shadow: var(--shadow-sm);
    }
    .nav { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-main); }
    .brand-logo-img { height: 42px; width: auto; border-radius: 6px; object-fit: contain; }
    .brand-text strong { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 18px; color: var(--primary-black); display: block; line-height: 1.1; }
    .brand-text span { color: var(--primary-red); font-size: 11px; font-weight: 800; display: block; }

    /* البانر الرئيسي */
    .hero { padding: 16px 0 10px; }
    .hero-banner {
      background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
      border-radius: var(--radius-lg); border: 1px solid var(--border-color);
      padding: 18px 20px; display: flex; flex-direction: column; gap: 4px;
    }
    .hero-tag {
      display: inline-block; background: #ffe5e5; color: var(--primary-red);
      font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 99px; width: fit-content;
    }
    .hero h1 { font-size: 22px; font-weight: 900; color: var(--primary-black); }
    .hero p { color: var(--text-muted); font-size: 12.5px; font-weight: 600; }

    /* شبكة عرض الموديلات */
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 16px; }
    @media (max-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }

    .product-card {
      background: var(--bg-card); border-radius: var(--radius);
      border: 1px solid var(--border-color); overflow: hidden;
      display: flex; flex-direction: column; position: relative;
      transition: transform .2s, box-shadow .2s; cursor: pointer;
    }
    .product-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }

    .badge-tag {
      position: absolute; top: 8px; right: 8px; z-index: 5;
      background: var(--primary-black); color: #fff;
      font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 4px;
    }

    .product-thumb { aspect-ratio: 3/4; background: #f1f5f9; overflow: hidden; position: relative; }
    .product-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }

    .product-info { padding: 12px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
    .product-title { font-size: 14px; font-weight: 800; color: var(--text-main); }
    .price-tag { font-size: 16px; font-weight: 900; color: var(--primary-red); }
    .colors-info { font-size: 11px; color: var(--text-muted); font-weight: 700; }
    .product-code { font-size: 11px; background: var(--accent-gray); padding: 2px 7px; border-radius: 4px; font-weight: 800; display: inline-block; width: fit-content; }

    /* ===== زر عرض التفاصيل: حافة نيون متحركة باستمرار ===== */

.btn-action {
      --btn-border: 2.5px;
      --btn-radius: 12px;
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      min-height: 46px;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: var(--btn-radius);
      overflow: hidden;
      text-decoration: none;
      color: #fff;
      font-size: 13.5px;
      font-weight: 900;
      letter-spacing: .2px;
      line-height: 1.4;
      background: #0f172a;
      box-shadow: 0 0 10px rgba(217, 4, 41, 0.35), 0 4px 14px rgba(255, 46, 136, 0.18);
      animation: dragonPulse 2.6s ease-in-out infinite;
      transition: transform .15s ease;
    }

    /* الحافة الدوارة (تعمل دائماً): أحمر ← وردي ← ذهبي ← أبيض */
    .btn-action::before {
      content: "";
      position: absolute;
      z-index: -2;
      inset: -80%;
      background: conic-gradient(
        from 0deg,
        #d90429 0deg,
        #ff2e88 70deg,
        #ffb703 130deg,
        #ffffff 160deg,
        #ffb703 190deg,
        #ff2e88 250deg,
        #d90429 320deg,
        #d90429 360deg
      );
      animation: dragonSpin 2.4s linear infinite;
    }

    /* السطح الداخلي مع لمعة تمر على الزر */
    .btn-action::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: var(--btn-border);
      border-radius: calc(var(--btn-radius) - var(--btn-border));
      background:
        linear-gradient(110deg, transparent 35%, rgba(255,255,255,.16) 50%, transparent 65%) 0 0 / 250% 100% no-repeat,
        linear-gradient(135deg, #0b1020 0%, #1a1030 55%, #2a0a1c 100%);
      animation: dragonShine 3.2s ease-in-out infinite;
    }

    .btn-action span { text-shadow: 0 0 8px rgba(255, 46, 136, .55); }

    .btn-action svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      color: #ffb703;
      animation: dragonArrow 1.6s ease-in-out infinite;
    }

    @keyframes dragonSpin  { to { transform: rotate(360deg); } }
    @keyframes dragonShine { 0% { background-position: 150% 0, 0 0; } 60%, 100% { background-position: -50% 0, 0 0; } }
    @keyframes dragonArrow { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-4px); } }
    @keyframes dragonPulse {
      0%, 100% { box-shadow: 0 0 8px rgba(217, 4, 41, 0.35), 0 4px 14px rgba(255, 46, 136, 0.15); }
      50%      { box-shadow: 0 0 18px rgba(217, 4, 41, 0.6), 0 6px 22px rgba(255, 46, 136, 0.35); }
    }

    @media (hover: hover) {
      .btn-action:hover { transform: translateY(-2px); }
      .btn-action:hover::before { animation-duration: 1.4s; }
    }

    .btn-action:active { transform: scale(0.97); }

    .btn-action:focus-visible { outline: 3px solid #ffb703; outline-offset: 2px; }

    @media (max-width: 640px) {
      .btn-action { min-height: 46px; font-size: 12.5px; margin-top: 8px; padding: 9px 8px; gap: 6px; }
      .btn-action svg { width: 15px; height: 15px; }
    }

    /* تقليل الحركة حسب إعدادات الجهاز */
    @media (prefers-reduced-motion: reduce) {
      .btn-action, .btn-action::before, .btn-action::after, .btn-action svg { animation: none; }
    }

    
footer { text-align: center; padding: 25px 0; color: var(--text-muted); font-size: 12px; font-weight: 700; margin-top: 30px; }
  </style>
</head>

<body>

  <div class="top-bar">Dragon Triko 2026 • معمل ألبسة التريكو الشتوية</div>

  <header>
    <div class="container nav">
      <a class="brand" href="index.html">
        <img src="logo.png" alt="Dragon Triko" class="brand-logo-img" onerror="this.style.display='none'">
        <div class="brand-text">
          <strong>DRAGON TRIKO</strong>
          <span>ألبسة شتوية فاخرة</span>
        </div>
      </a>
    </div>
  </header>

  <main class="hero">
    <div class="container">
      <div class="hero-banner">
        <span class="hero-tag">الكتالوج التفاعلي</span>
        <h1>كتالوج المنتجات بخصائص مطورة</h1>
        <p>اضغطي على أي موديل للانتقال مباشرة إلى صفحته الخاصة واستعراض التفاصيل والتريكو.</p>
      </div>

      <div class="grid" id="productsGrid"></div>
    </div>
  </main>

  <footer>
    <div class="container">جميع الحقوق محفوظة Dragon Triko 2026 ©</div>
  </footer>

  <script>
    // جلب البيانات من ملف products.json والانتقال مباشرة لصفحة product.html عند الضغط
    async function loadProducts() {
      try {
        const response = await fetch('products.json?v=' + new Date().getTime());
        const products = await response.json();

        const grid = document.getElementById('productsGrid');
        grid.innerHTML = products.map(item => {
          const mainImg = Array.isArray(item.images) ? item.images[0] : (item.image || 'M102.jpg');
          const code = item.code || item['الكود'] || item.id;
          const title = item.title || item['اسم الموديل'] || 'موديل بدون اسم';
          const price = item.price || item['السعر'] || '';
          const colors = item.colors || item['الألوان'] || 'متعددة';
          const tag = item.tag || item['التصنيف'] || 'أحدث الموديلات';
          const url = `product.html?code=${encodeURIComponent(code)}`;

          return `
            <div class="product-card" onclick="goToProduct('${code}')">
              <span class="badge-tag">${tag}</span>
              <div class="product-thumb">
                <img src="${mainImg}" alt="${title}" loading="lazy" onerror="this.src='logo.png';">
              </div>
              <div class="product-info">
                <div class="product-title">${title}</div>
                <div class="price-tag">${price}</div>
                <div class="colors-info">الألوان: ${colors}</div>
                <div class="product-code">الكود: ${code}</div>

                <a class="btn-action" href="${url}" onclick="event.stopPropagation()" aria-label="عرض تفاصيل ${title}">
                  <span>عرض التفاصيل</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
                </a>
              </div>
            </div>
          `;
        }).join('');

      } catch (error) {
        console.error('خطأ في تحميل المنتجات:', error);
      }
    }

    function goToProduct(code) {
      window.location.href = `product.html?code=${encodeURIComponent(code)}`;
    }

    loadProducts();
  </script>
</body>
</html>
