<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Dragon Triko | الكتالوج الرقمي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --accent-red:#e62323;
      --bg0:#0c0d10;
      --border: rgba(255,255,255,.08);
      --text:#ffffff;
      --muted:#b8b8c2;
    }
    *{ box-sizing:border-box; margin:0; padding:0; font-family:'Tajawal',sans-serif; -webkit-tap-highlight-color:transparent; }
    body{ 
      background: radial-gradient(1200px 600px at 20% -10%, rgba(230,35,35,.18), transparent 55%),
                  linear-gradient(180deg, var(--bg0), #07080b 70%);
      color:var(--text); min-height:100vh; 
    }
    .container{ width:min(1200px, 92%); margin:0 auto; }
    header{
      position:sticky; top:0; z-index:50; backdrop-filter: blur(14px);
      background: rgba(10,11,16,.85); border-bottom: 1px solid var(--border);
    }
    .nav{ display:flex; align-items:center; justify-content:space-between; padding:14px 0; }
    .brand{ display:flex; align-items:center; gap:12px; }
    .logo{
      width:40px; height:40px; border-radius:12px;
      background: linear-gradient(135deg, #e62323, #c5a880);
      display:grid; place-items:center; font-weight:900;
    }
    .brand strong{ font-family: 'Montserrat', sans-serif; font-size:16px; }
    .controls{ margin: 20px 0; display:flex; gap:10px; flex-wrap:wrap; }
    .search{
      flex:1; min-width: 220px; display:flex; align-items:center;
      padding: 10px 14px; border-radius: 14px; border:1px solid var(--border);
      background: rgba(255,255,255,.05);
    }
    .search input{ width:100%; border:none; outline:none; background: transparent; color:#fff; font-size:14px; }
    .select{
      border-radius: 14px; padding: 10px 14px; border:1px solid var(--border);
      background: #161822; color: #fff; font-weight:700; outline:none;
    }
    .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:16px; padding-bottom: 40px; }
    .card{
      border-radius: 16px; border:1px solid var(--border);
      background: rgba(255,255,255,.03); overflow:hidden; display:flex; flex-direction:column;
    }
    .thumb{ height: 260px; width:100%; background: #000; position:relative; }
    .thumb img{ width:100%; height:100%; object-fit:cover; }
    .badge{
      position:absolute; top:10px; right:10px; padding:4px 10px; border-radius:999px;
      background: rgba(10,11,16,.85); border:1px solid var(--accent-red); font-size:11px; font-weight:800;
    }
    .card-body{ padding: 14px; display:flex; flex-direction:column; gap:8px; }
    .title{ font-weight:900; font-size: 16px; }
    .meta{ display:grid; gap:4px; font-size:13px; color:rgba(255,255,255,.8); }
    .row{ display:flex; justify-content:space-between; }
    .row span:first-child{ color: var(--muted); }
    .btn-wa{
      margin-top: 10px; width: 100%; padding: 10px; border-radius: 12px;
      background: #25d366; color: #fff; text-decoration: none; text-align: center;
      font-weight: 800; font-size: 13px; display:block;
    }
    #loading{ text-align:center; padding: 40px; font-weight:800; }
  </style>
</head>
<body>

  <header>
    <div class="container nav">
      <div class="brand">
        <div class="logo">DT</div>
        <div><strong>Dragon Triko</strong></div>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="controls">
      <div class="search">
        <input type="text" id="searchInput" placeholder="ابحث باسم الموديل، الكود، أو الخامة..." oninput="filterData()">
      </div>
      <select id="categoryFilter" class="select" onchange="filterData()">
        <option value="">كل التصنيفات</option>
      </select>
    </div>

    <div id="loading">جاري تحميل المنتجات...</div>
    <div id="productsGrid" class="grid"></div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyKT1gEticoiB3mTJ_b8HpATVh-1MpGZ-4xyZTKNWf_VSXZR0XYSNAZ6CPGncobs-E/exec";
    let products = [];

    async function fetchData() {
      try {
        const response = await fetch(API_URL, { redirect: "follow" });
        products = await response.json();
        document.getElementById('loading').style.display = 'none';
        populateCategories();
        renderProducts(products);
      } catch (error) {
        document.getElementById('loading').innerHTML = "حدث خطأ أثناء تحميل البيانات، يرجى التأكد من اتصالك بالإنترنت.";
        console.error(error);
      }
    }

    function populateCategories() {
      const select = document.getElementById('categoryFilter');
      const categories = [...new Set(products.map(p => p["التصنيف"]).filter(Boolean))];
      categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        select.appendChild(opt);
      });
    }

    function renderProducts(items) {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = "";
      
      if(items.length === 0) {
        grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center;'>لا توجد منتجات مطابقة.</p>";
        return;
      }

      items.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="thumb">
            <span class="badge">${p["التصنيف"] || 'عام'}</span>
            <img src="${p["الصورة"] || 'https://via.placeholder.com/300'}" alt="${p["اسم الموديل"] || ''}">
          </div>
          <div class="card-body">
            <div class="title">${p["اسم الموديل"] || 'بدون اسم'}</div>
            <div class="meta">
              <div class="row"><span>الكود:</span> <strong>${p["الكود"] || '-'}</strong></div>
              <div class="row"><span>الخامة:</span> <strong>${p["الخامة"] || '-'}</strong></div>
              <div class="row"><span>المقاسات:</span> <strong>${p["المقاسات"] || '-'}</strong></div>
              <div class="row"><span>أقل كمية:</span> <strong>${p["أقل كمية"] || '-'}</strong></div>
              <div class="row"><span>اللون:</span> <strong>${p["كود اللون"] || '-'}</strong></div>
            </div>
            <a href="https://wa.me/?text=${encodeURIComponent('مرحباً، أود الاستفسار عن موديل: ' + (p["اسم الموديل"] || '') + ' (كود: ' + (p["الكود"] || '') + ')')}" target="_blank" class="btn-wa">طلب عبر واتساب</a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterData() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const category = document.getElementById('categoryFilter').value;

      const filtered = products.filter(p => {
        const matchesQuery = (p["اسم الموديل"] || '').toString().toLowerCase().includes(query) ||
                             (p["الكود"] || '').toString().toLowerCase().includes(query) ||
                             (p["الخامة"] || '').toString().toLowerCase().includes(query);
        const matchesCategory = category === "" || p["التصنيف"] === category;
        return matchesQuery && matchesCategory;
      });

      renderProducts(filtered);
    }

    fetchData();
  </script>
</body>
</html>
