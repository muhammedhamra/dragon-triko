<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Dragon Triko | أزياء التريكو الشتوية</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #f8f9fa;
      --bg-card: #ffffff;
      --text-main: #111111;
      --text-muted: #666666;
      --primary-red: #d90429;
      --primary-black: #0f172a;
      --accent-gray: #f1f5f9;
      --border-color: #e2e8f0;
      --radius: 12px;
      --radius-lg: 20px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
      --shadow-md: 0 10px 25px rgba(0,0,0,0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; }

    .container { width: min(1200px, 92%); margin: 0 auto; }

    .top-bar {
      background: var(--primary-black); color: #fff; text-align: center;
      padding: 6px 10px; font-size: 12px; font-weight: 700; letter-spacing: .5px;
    }

    header {
      position: sticky; top: 0; z-index: 50; background: #ffffff;
      border-bottom: 1px solid var(--border-color); box-shadow: var(--shadow-sm);
    }
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 0; gap: 16px;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; color: var(--text-main);
    }
    .logo-box {
      width: 40px; height: 40px; border-radius: 10px;
      background: var(--primary-red); color: #fff;
      display: grid; place-items: center; font-weight: 900;
    }
    .brand strong {
      font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 18px; color: var(--primary-black);
    }
    .brand span { color: var(--primary-red); font-size: 11px; font-weight: 800; display: block; margin-top: 2px; }

    .hero { padding: 20px 0 10px; }
    .hero-banner {
      background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
      border-radius: var(--radius-lg); border: 1px solid var(--border-color);
      padding: 24px; display: flex; flex-direction: column; gap: 6px;
    }
    .hero-tag {
      display: inline-block; background: #ffe5e5; color: var(--primary-red);
      font-size: 12px; font-weight: 800; padding: 4px 12px; border-radius: 99px; width: fit-content;
    }
    .hero h1 { font-size: 26px; font-weight: 900; color: var(--primary-black); }
    .hero p { color: var(--text-muted); font-size: 13.5px; font-weight: 600; }

    .controls {
      background: #ffffff; padding: 14px; border-radius: var(--radius);
      border: 1px solid var(--border-color); margin: 18px 0;
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
      box-shadow: var(--shadow-sm);
    }
    .search-box {
      flex: 1; min-width: 220px; display: flex; align-items: center;
      background: var(--accent-gray); border-radius: 8px; padding: 0 12px;
    }
    .search-box input {
      width: 100%; height: 42px; border: none; background: transparent; outline: none;
      font-weight: 700; font-size: 13.5px; color: var(--text-main);
    }

    .select-box {
      height: 42px; padding: 0 14px; border-radius: 8px;
      border: 1px solid var(--border-color); background: #ffffff;
      font-weight: 700; font-size: 13px; color: var(--text-main); outline: none;
    }

    .section-head { margin-bottom: 16px; }
    .section-head h2 { font-size: 20px; font-weight: 900; color: var(--primary-black); }

    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding-bottom: 40px; }
    @media (max-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }

    .product-card {
      background: var(--bg-card); border-radius: var(--radius);
      border: 1px solid var(--border-color); overflow: hidden;
      display: flex; flex-direction: column; transition: transform .2s, box-shadow .2s;
      position: relative; cursor: pointer; text-decoration: none; color: inherit;
    }
    .product-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: #cbd5e1; }

    .badge-tag {
      position: absolute; top: 10px; right: 10px; z-index: 2;
      background: var(--primary-black); color: #fff;
      font-size: 10.5px; font-weight: 800; padding: 3px 8px; border-radius: 4px;
    }

    .product-thumb { aspect-ratio: 3/4; background: #f8fafc; overflow: hidden; position: relative; }
    .product-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; }

    .product-info { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .product-title { font-size: 14px; font-weight: 800; color: var(--text-main); line-height: 1.3; }
    
    .price-tag { font-size: 16px; font-weight: 900; color: var(--primary-red); margin-top: 2px; }
    .colors-info { font-size: 11.5px; color: var(--text-muted); font-weight: 700; }

    .product-meta { font-size: 12px; color: var(--text-muted); font-weight: 600; display: flex; justify-content: space-between; }
    .product-code { background: var(--accent-gray); padding: 2px 6px; border-radius: 4px; font-weight: 800; color: var(--primary-black); }

    .btn-view {
      margin-top: auto; padding: 10px; border-radius: 8px; background: var(--primary-black);
      color: #ffffff; text-align: center; font-weight: 800; font-size: 12.5px;
      display: block; border: none; transition: background .2s;
    }
    .btn-view:hover { background: var(--primary-red); }

    footer { background: #ffffff; border-top: 1px solid var(--border-color); padding: 24px 0; text-align: center; color: var(--text-muted); font-size: 13px; font-weight: 700; }
    .state-msg { grid-column: 1 / -1; text-align: center; padding: 50px 20px; color: var(--text-muted); font-weight: 700; }
  </style>
</head>

<body>

  <div class="top-bar">تشكيلة شتاء 2026 • ألبسة تريكو جملة مباشرة من الورشة</div>

  <header>
    <div class="container nav">
     <a class="brand" href="#" style="gap: 12px; display: flex; align-items: center;">
  <img src="Logo.png" alt="Dragon Triko Logo" style="height: 45px; width: auto; border-radius: 8px; object-fit: contain;">
  <div>
    <strong>DRAGON TRIKO</strong>
    <span>ألبسة شتوية فاخرة</span>
  </div>
</a>

    </div>
  </header>

  <main class="hero">
    <div class="container">
      <div class="hero-banner">
        <span class="hero-tag">الكتالوج الرقمي</span>
        <h1>أحدث موديلات التريكو للجملة</h1>
        <p>تصفح الموديلات والأسعار، واضغط على أي موديل لرؤية التفاصيل والألوان كاملة.</p>
      </div>

      <div class="controls" id="products">
        <div class="search-box">
          <input id="searchInput" type="text" placeholder="ابحث باسم الموديل أو الكود..."/>
        </div>

        <select class="select-box" id="categorySelect">
          <option value="all">كل التصنيفات</option>
        </select>
      </div>

      <div class="section-head">
        <h2>أحدث الموديلات</h2>
      </div>

      <div class="grid" id="productsGrid">
        <div class="state-msg">جاري تحميل المنتجات...</div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>جميع الحقوق محفوظة © Dragon Triko 2026</p>
    </div>
  </footer>

  <script>
    let productsData = [];

    function formatImageUrl(url) {
      if (!url) return '';
      url = String(url).trim();
      const matchId = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      if (matchId && matchId[1]) {
        return `https://lh3.googleusercontent.com/d/${matchId[1]}`;
      }
      return url;
    }

    async function fetchCatalog() {
      try {
        const response = await fetch('products.json?v=' + new Date().getTime());
        if (!response.ok) throw new Error('File not found');
        
        productsData = await response.json();
        
        const categories = new Set();
        productsData.forEach(row => {
          if (row.tag) categories.add(String(row.tag).trim());
        });

        populateCategories(Array.from(categories));
        renderGrid();

      } catch (error) {
        console.error("Error loading products.json:", error);
        document.getElementById('productsGrid').innerHTML = '<div class="state-msg">⚠️ تعذر تحميل المنتجات. تأكدي من وجود ملف products.json.</div>';
      }
    }

    function populateCategories(cats) {
      const select = document.getElementById('categorySelect');
      select.innerHTML = '<option value="all">كل التصنيفات</option>';
      cats.forEach(c => {
        if (!c) return;
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        select.appendChild(opt);
      });
    }

    function renderGrid() {
      const grid = document.getElementById('productsGrid');
      const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
      const selectedCat = document.getElementById('categorySelect').value;

      const filtered = productsData.filter(p => {
        const title = (p.title || p['اسم الموديل'] || '').toLowerCase();
        const code = (p.code || p['الكود'] || '').toLowerCase();
        const tag = p.tag || p['التصنيف'] || 'عام';

        const matchesSearch = title.includes(searchVal) || code.includes(searchVal);
        const matchesCat = (selectedCat === 'all' || tag === selectedCat);

        return matchesSearch && matchesCat;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="state-msg">لا توجد موديلات مطابقة للبحث.</div>';
        return;
      }

      grid.innerHTML = filtered.map(item => {
        const fallbackImg = 'https://via.placeholder.com/400x530/f1f5f9/0f172a?text=Dragon+Triko';
        const rawImg = item.image || item['الصورة'] || '';
        const displayImg = formatImageUrl(rawImg) || fallbackImg;
        
        const title = item.title || item['اسم الموديل'] || 'موديل بدون اسم';
        const code = item.code || item['الكود'] || item.id;
        const price = item.price || item['السعر'] || 'غير محدد';
        const colors = item.colors || item['الألوان'] || item['الوان'] || 'متعددة';
        const tag = item.tag || item['التصنيف'] || '';

        return `
          <a class="product-card" href="product.html?id=${item.id}" target="_blank">
            ${tag ? `<span class="badge-tag">${tag}</span>` : ''}
            <div class="product-thumb">
              <img src="${displayImg}" alt="${title}" onerror="this.src='${fallbackImg}'" loading="lazy">
            </div>
            <div class="product-info">
              <div class="product-title">${title}</div>
              <div class="price-tag">${price}</div>
              <div class="colors-info">الألوان: ${colors}</div>
              <div class="product-meta">
                <span>الكود: <strong class="product-code">${code}</strong></span>
              </div>
              <div class="btn-view">عرض التفاصيل الكاملة ↵</div>
            </div>
          </a>
        `;
      }).join('');
    }

    document.getElementById('searchInput').addEventListener('input', renderGrid);
    document.getElementById('categorySelect').addEventListener('change', renderGrid);

    fetchCatalog();
  </script>
</body>
</html>
